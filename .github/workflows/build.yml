# Каждый push и PR: clippy, тесты и exe в артефактах.
# Тег v* (например v1.0.1): то же и релиз с yamusic-rs.exe — его ищет встроенная обновлялка.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash target/release/yamusic-rs.exe -Algorithm SHA256).Hash.ToLower()

      # Без zip: из артефактов скачивается сразу yamusic-rs.exe.
      - uses: actions/upload-artifact@v7
        with:
          path: target/release/yamusic-rs.exe
          archive: false

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/yamusic-rs.exe --title "Яндекс Музыка RS ${GITHUB_REF_NAME#v}" --generate-notes
